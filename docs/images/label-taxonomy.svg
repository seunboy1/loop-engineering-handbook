<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="32" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">The Label Taxonomy Is the API Between You and Your Agents</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Three label families decide what an agent may touch. Nothing else gates the queue.</text>

  <!-- RISK column -->
  <rect x="40" y="84" width="280" height="300" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="180" y="112" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">RISK — how much damage?</text>

  <rect x="62" y="130" width="236" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <text x="76" y="150" font-size="12.5" font-weight="700" fill="#14532d">risk:low</text>
  <text x="76" y="170" font-size="10.5" fill="#166534">tests, docs, typos, small fixes → AGENT</text>

  <rect x="62" y="192" width="236" height="52" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.6"/>
  <text x="76" y="212" font-size="12.5" font-weight="700" fill="#713f12">risk:medium</text>
  <text x="76" y="232" font-size="10.5" fill="#854d0e">contained features → agent once trusted</text>

  <rect x="62" y="254" width="236" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="76" y="274" font-size="12.5" font-weight="700" fill="#7f1d1d">risk:high</text>
  <text x="76" y="294" font-size="10.5" fill="#991b1b">auth, payments, migrations, deploys</text>

  <text x="180" y="330" font-size="11" fill="#b91c1c" text-anchor="middle" font-style="italic">high risk never enters</text>
  <text x="180" y="346" font-size="11" fill="#b91c1c" text-anchor="middle" font-style="italic">the worker queue</text>
  <text x="180" y="370" font-size="10.5" fill="#6b7280" text-anchor="middle">Start everything at high. Demote on evidence.</text>

  <!-- TYPE column -->
  <rect x="340" y="84" width="280" height="300" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="112" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">TYPE — what kind of work?</text>

  <rect x="362" y="130" width="236" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="376" y="155" font-size="12" fill="#1e3a8a">type:bug · type:test</text>

  <rect x="362" y="180" width="236" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="376" y="205" font-size="12" fill="#1e3a8a">type:docs · type:chore</text>

  <rect x="362" y="230" width="236" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="376" y="255" font-size="12" fill="#1e3a8a">type:refactor · type:feature</text>

  <rect x="362" y="280" width="236" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="376" y="305" font-size="12" fill="#3730a3">type:spike (needs thinking)</text>

  <text x="480" y="352" font-size="10.5" fill="#6b7280" text-anchor="middle">Type drives which skill the worker loads</text>
  <text x="480" y="370" font-size="10.5" fill="#6b7280" text-anchor="middle">and how strict the test bar is.</text>

  <!-- ROUTING column -->
  <rect x="640" y="84" width="280" height="300" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="780" y="112" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">ROUTING — who acts next?</text>

  <rect x="662" y="130" width="236" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="676" y="152" font-size="12.5" font-weight="700" fill="#14532d">agent-ready</text>
  <text x="676" y="171" font-size="10.5" fill="#166534">spec is unambiguous, tests exist,</text>
  <text x="676" y="186" font-size="10.5" fill="#166534">no product judgement needed</text>

  <rect x="662" y="202" width="236" height="62" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.8"/>
  <text x="676" y="224" font-size="12.5" font-weight="700" fill="#7c2d12">needs-human</text>
  <text x="676" y="243" font-size="10.5" fill="#9a3412">a real decision is missing —</text>
  <text x="676" y="258" font-size="10.5" fill="#9a3412">agent must stop and ask</text>

  <rect x="662" y="274" width="236" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="676" y="295" font-size="12" font-weight="700" fill="#334155">blocked</text>
  <text x="676" y="312" font-size="10.5" fill="#475569">waiting on an external dependency</text>

  <text x="780" y="352" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">The worker query is exactly:</text>
  <text x="780" y="371" font-size="10.5" fill="#166534" text-anchor="middle" font-family="Courier, monospace">is:open agent-ready risk:low -needs-human</text>

  <text x="480" y="410" font-size="11.5" fill="#6b7280" text-anchor="middle">Removing `needs-human` is how you say yes. Adding `risk:high` is how you say never.</text>
</svg>
