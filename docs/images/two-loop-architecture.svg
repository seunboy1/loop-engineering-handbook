<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <text x="480" y="36" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">The Two-Loop Agent System</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">One loop grooms the work. One loop does the work. A human approves the merge.</text>

  <!-- Control plane band -->
  <rect x="330" y="86" width="300" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="112" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">CONTROL PLANE</text>
  <text x="480" y="132" font-size="12" fill="#4338ca" text-anchor="middle">GitHub Issues · labels · status · comments</text>

  <!-- Manager loop box -->
  <rect x="60" y="196" width="340" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="230" y="224" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">LOOP 1 — MANAGER</text>
  <text x="230" y="248" font-size="12" fill="#047857" text-anchor="middle">runs daily · read + label only</text>
  <text x="80" y="276" font-size="12.5" fill="#064e3b">• Triage every open issue</text>
  <text x="80" y="298" font-size="12.5" fill="#064e3b">• Apply risk / type / routing labels</text>
  <text x="80" y="320" font-size="12.5" fill="#064e3b">• Fix stale status, file new bugs</text>
  <text x="80" y="340" font-size="11" fill="#059669" font-style="italic">no code push · no merge</text>

  <!-- Worker loop box -->
  <rect x="560" y="196" width="340" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="730" y="224" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">LOOP 2 — WORKER</text>
  <text x="730" y="248" font-size="12" fill="#1d4ed8" text-anchor="middle">runs daily · max 3 issues</text>
  <text x="580" y="276" font-size="12.5" fill="#172554">• Claim `agent-ready` + `risk:low`</text>
  <text x="580" y="298" font-size="12.5" fill="#172554">• Write code + tests, self-review</text>
  <text x="580" y="320" font-size="12.5" fill="#172554">• Open PR, post evidence, stop</text>
  <text x="580" y="340" font-size="11" fill="#2563eb" font-style="italic">branch only · never merges</text>

  <!-- Arrows: control plane -> manager -->
  <path d="M 340 146 L 240 190" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <text x="250" y="176" font-size="11" fill="#047857">reads backlog</text>

  <!-- manager -> control plane (writes labels) -->
  <path d="M 380 196 L 430 150" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#ag)" stroke-dasharray="5 4"/>
  <text x="396" y="192" font-size="11" fill="#047857">writes labels</text>

  <!-- control plane -> worker -->
  <path d="M 620 146 L 718 190" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="628" y="176" font-size="11" fill="#1d4ed8">claims queue</text>

  <!-- worker -> PR -->
  <path d="M 730 346 L 730 386" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <!-- PR / verification box -->
  <rect x="560" y="386" width="340" height="58" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="730" y="409" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">VERIFICATION LAYER</text>
  <text x="730" y="429" font-size="11.5" fill="#c2410c" text-anchor="middle">CI · tests · second automated reviewer</text>

  <!-- verification -> human -->
  <path d="M 560 415 L 410 415" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>

  <!-- Human box -->
  <rect x="60" y="386" width="340" height="58" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="230" y="409" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">HUMAN — the only merge button</text>
  <text x="230" y="429" font-size="11.5" fill="#b91c1c" text-anchor="middle">reviews PR · answers `needs-human` tickets</text>

  <!-- human -> control plane (feedback) -->
  <path d="M 120 386 L 120 150 L 330 118" stroke="#ef4444" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="6 4"/>
  <text x="130" y="250" font-size="11" fill="#b91c1c" transform="rotate(-90 130 250)">feedback re-enters the loop</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#10b981"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b82f6"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f97316"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ef4444"/></marker>
  </defs>
</svg>
