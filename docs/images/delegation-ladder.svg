<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">The Delegation Ladder — Earn Autonomy, Don't Assume It</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Each rung stays until its metrics hold for two weeks. Never skip a rung.</text>

  <!-- ladder steps -->
  <rect x="60" y="300" width="200" height="72" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="160" y="322" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">RUNG 1 — OBSERVE</text>
  <text x="160" y="341" font-size="10.5" fill="#166534" text-anchor="middle">dry-run only, no writes</text>
  <text x="160" y="358" font-size="10.5" fill="#166534" text-anchor="middle">you read the proposed diff</text>

  <rect x="280" y="238" width="200" height="72" rx="9" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="260" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">RUNG 2 — TRIAGE</text>
  <text x="380" y="279" font-size="10.5" fill="#047857" text-anchor="middle">manager loop writes labels</text>
  <text x="380" y="296" font-size="10.5" fill="#047857" text-anchor="middle">still zero code changes</text>

  <rect x="500" y="176" width="200" height="72" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="198" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">RUNG 3 — TRIVIAL PRs</text>
  <text x="600" y="217" font-size="10.5" fill="#1d4ed8" text-anchor="middle">docs, tests, typos</text>
  <text x="600" y="234" font-size="10.5" fill="#1d4ed8" text-anchor="middle">1 issue per run, you merge</text>

  <rect x="720" y="114" width="200" height="72" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="820" y="136" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">RUNG 4 — REAL WORK</text>
  <text x="820" y="155" font-size="10.5" fill="#4338ca" text-anchor="middle">bugs + contained features</text>
  <text x="820" y="172" font-size="10.5" fill="#4338ca" text-anchor="middle">3 issues per run, you merge</text>

  <!-- ceiling line -->
  <line x1="60" y1="92" x2="920" y2="92" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="480" y="84" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CEILING — the human keeps the merge button, the deploy, and all risk:high work. Forever.</text>

  <!-- connecting arrows -->
  <path d="M 260 320 L 276 288" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#la)"/>
  <path d="M 480 258 L 496 226" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#la)"/>
  <path d="M 700 196 L 716 164" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#la)"/>

  <!-- gate labels -->
  <text x="268" y="312" font-size="9.5" fill="#475569" transform="rotate(-57 268 312)">0 bad labels</text>
  <text x="488" y="250" font-size="9.5" fill="#475569" transform="rotate(-57 488 250)">2wks accurate</text>
  <text x="708" y="188" font-size="9.5" fill="#475569" transform="rotate(-57 708 188)">&gt;80% merged</text>

  <text x="60" y="404" font-size="11.5" fill="#6b7280">Promotion gate: first-pass merge rate holds above 80% and rework rate below 20% for two consecutive weeks.</text>

  <defs>
    <marker id="la" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
  </defs>
</svg>
