name: Agent-ready engineering task
description: A bounded task that can be evaluated for the autonomous worker queue
title: "[Task]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Write for a reviewer who has no hidden context. A manager loop will assess risk and readiness; this template does not make the task agent-ready by itself.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing? Include observed behavior and evidence.
      placeholder: The webhook handler throws when...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe externally observable behavior, not an implementation preference.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Add objective, independently testable checks.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: APIs, files, compatibility requirements, or adjacent work that must remain unchanged.

  - type: textarea
    id: verification
    attributes:
      label: Suggested verification
      description: Existing tests or commands a worker should run, if known.

  - type: checkboxes
    id: risk
    attributes:
      label: Reporter risk check
      description: Checking a box routes the issue toward human review; it does not block filing.
      options:
        - label: This may involve authentication, authorization, or secrets.
        - label: This may involve billing, payments, or destructive data changes.
        - label: This may involve production deployment, infrastructure, or a public API break.
        - label: A product or architecture decision is still required.
